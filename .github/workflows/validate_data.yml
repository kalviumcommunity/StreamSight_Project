name: Data Validation

on:
  push:
    branches:
      - main
      - 2.59
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest

      - name: Run validation script
        run: |
          python validate_data.py data/engagement_data.csv

      - name: Run unit tests
        run: |
          pytest -q test_validate_data.py
