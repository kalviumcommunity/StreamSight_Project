name: Weekly Data Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt changes"

      - name: Run pipeline
        run: |
          python pipeline.py --input data/engagement_data.csv --output output

      - name: Commit output
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "bot@example.com"
          git add output/
          git commit -m "pipeline: automated refresh" || echo "No changes to commit"
          git push || echo "Push failed - check remote configuration"
